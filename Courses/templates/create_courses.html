<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание курса</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header class="bg-secondary text-white text-center py-4">
        <h1>Создание курса</h1>
    </header>

    <main class="container my-5">
        <form action="{% url 'create_course' %}" method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label for="course_title" class="form-label">Название курса:</label>
                <input type="text" class="form-control" id="course_title" name="course_title" required>
            </div>

            <div class="mb-4">
                <label for="course_description" class="form-label">Описание курса:</label>
                <textarea class="form-control" id="course_description" name="course_description" required></textarea>
            </div>

            <section>
                <h2 class="my-4">Модули</h2>
                <div id="modules">
                    <!-- Первый модуль -->
                    <div class="module" id="module_1">
                        <h3>Модуль 1</h3>
                        <div class="mb-3">
                            <label for="module_title_1" class="form-label">Название модуля:</label>
                            <input type="text" class="form-control" id="module_title_1" name="module_title_1" required>
                        </div>
                        <h4>Разделы</h4>
                        <div class="sections" id="sections_1">
                            <div class="section mb-4">
                                <h5>Раздел 1.1</h5>
                                <div class="mb-3">
                                    <label for="section_title_1_1" class="form-label">Название раздела:</label>
                                    <input type="text" class="form-control" id="section_title_1_1" name="section_title_1_1" required>
                                </div>
                                <h6>Задания</h6>
                                <div class="tasks" id="tasks_1_1">
                                    <div class="task mb-3">
                                        <div class="mb-2">
                                            <label for="task_title_1_1_1" class="form-label">Название задания:</label>
                                            <input type="text" class="form-control" id="task_title_1_1_1" name="task_title_1_1_1" required>
                                        </div>

                                        <div class="mb-2">
                                            <label for="task_description_1_1_1" class="form-label">Описание задания:</label>
                                            <textarea class="form-control" id="task_description_1_1_1" name="task_description_1_1_1" required></textarea>
                                        </div>

                                        <div class="mb-2">
                                            <label for="task_answer_1_1_1" class="form-label">Ответ:</label>
                                            <input type="text" class="form-control" id="task_answer_1_1_1" name="task_answer_1_1_1" required>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-outline-primary" onclick="addTask(1, 1)">Добавить задание</button>
                            </div>
                        </div>
                        <button type="button" class="btn btn-outline-secondary" onclick="addSection(1)">Добавить раздел</button>
                    </div>
                </div>
            </section>

            <button type="button" class="btn btn-outline-success my-4" onclick="addModule()">Добавить модуль</button>
            <button type="submit" class="btn btn-secondary">Создать курс</button>
        </form>
    </main>

    <!-- Подключаем Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let moduleCount = 1;

        function addModule() {
            moduleCount++;
            const modulesDiv = document.getElementById('modules');
            const newModule = `
                <div class="module" id="module_${moduleCount}">
                    <h3>Модуль ${moduleCount}</h3>
                    <div class="mb-3">
                        <label for="module_title_${moduleCount}" class="form-label">Название модуля:</label>
                        <input type="text" class="form-control" id="module_title_${moduleCount}" name="module_title_${moduleCount}" required>
                    </div>
                    <h4>Разделы</h4>
                    <div class="sections" id="sections_${moduleCount}">
                        <div class="section mb-4">
                            <h5>Раздел ${moduleCount}.1</h5>
                            <div class="mb-3">
                                <label for="section_title_${moduleCount}_1" class="form-label">Название раздела:</label>
                                <input type="text" class="form-control" id="section_title_${moduleCount}_1" name="section_title_${moduleCount}_1" required>
                            </div>
                            <h6>Задания</h6>
                            <div class="tasks" id="tasks_${moduleCount}_1">
                                <div class="task mb-3">
                                    <div class="mb-2">
                                        <label for="task_title_${moduleCount}_1_1" class="form-label">Название задания:</label>
                                        <input type="text" class="form-control" id="task_title_${moduleCount}_1_1" name="task_title_${moduleCount}_1_1" required>
                                    </div>

                                    <div class="mb-2">
                                        <label for="task_description_${moduleCount}_1_1" class="form-label">Описание задания:</label>
                                        <textarea class="form-control" id="task_description_${moduleCount}_1_1" name="task_description_${moduleCount}_1_1" required></textarea>
                                    </div>

                                    <div class="mb-2">
                                        <label for="task_answer_${moduleCount}_1_1" class="form-label">Ответ:</label>
                                        <input type="text" class="form-control" id="task_answer_${moduleCount}_1_1" name="task_answer_${moduleCount}_1_1" required>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-outline-primary" onclick="addTask(${moduleCount}, 1)">Добавить задание</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-secondary" onclick="addSection(${moduleCount})">Добавить раздел</button>
                </div>
            `;
            modulesDiv.insertAdjacentHTML('beforeend', newModule);
        }

        function addSection(moduleId) {
            const sectionCount = document.querySelectorAll(`#sections_${moduleId} .section`).length + 1;
            const sectionsDiv = document.getElementById(`sections_${moduleId}`);
            const newSection = `
                <div class="section mb-4">
                    <h5>Раздел ${moduleId}.${sectionCount}</h5>
                    <div class="mb-3">
                        <label for="section_title_${moduleId}_${sectionCount}" class="form-label">Название раздела:</label>
                        <input type="text" class="form-control" id="section_title_${moduleId}_${sectionCount}" name="section_title_${moduleId}_${sectionCount}" required>
                    </div>
                    <h6>Задания</h6>
                    <div class="tasks" id="tasks_${moduleId}_${sectionCount}">
                        <div class="task mb-3">
                            <div class="mb-2">
                                <label for="task_title_${moduleId}_${sectionCount}_1" class="form-label">Название задания:</label>
                                <input type="text" class="form-control" id="task_title_${moduleId}_${sectionCount}_1" name="task_title_${moduleId}_${sectionCount}_1" required>
                            </div>
                            <div class="mb-2">
                                            <label for="task_description_${moduleId}_${sectionCount}_1" class="form-label">Описание задания:</label>
                                            <textarea class="form-control" id="task_description_${moduleId}_${sectionCount}_1" name="task_description_${moduleId}_${sectionCount}_1" required></textarea>
                                </div>

                            <div class="mb-2">
                                <label for="task_answer_${moduleId}_${sectionCount}_1" class="form-label">Ответ:</label>
                                <input type="text" class="form-control" id="task_answer_${moduleId}_${sectionCount}_1" name="task_answer_${moduleId}_${sectionCount}_1" required>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-primary" onclick="addTask(${moduleId}, ${sectionCount})">Добавить задание</button>
                </div>
            `;
            sectionsDiv.insertAdjacentHTML('beforeend', newSection);
        }

        function addTask(moduleId, sectionId) {
            const taskCount = document.querySelectorAll(`#tasks_${moduleId}_${sectionId} .task`).length + 1;
            const tasksDiv = document.getElementById(`tasks_${moduleId}_${sectionId}`);
            const newTask = `
                <div class="task mb-3">
                    <div class="mb-2">
                        <label for="task_title_${moduleId}_${sectionId}_${taskCount}" class="form-label">Название задания:</label>
                        <input type="text" class="form-control" id="task_title_${moduleId}_${sectionId}_${taskCount}" name="task_title_${moduleId}_${sectionId}_${taskCount}" required>
                    </div>

                    <div class="mb-2">
                        <label for="task_description_${moduleId}_${sectionId}_${taskCount}" class="form-label">Описание задания:</label>
                        <textarea class="form-control" id="task_description_${moduleId}_${sectionId}_${taskCount}" name="task_description_${moduleId}_${sectionId}_${taskCount}" required></textarea>
                    </div>

                    <div class="mb-2">
                        <label for="task_answer_${moduleId}_${sectionId}_${taskCount}" class="form-label">Ответ:</label>
                        <input type="text" class="form-control" id="task_answer_${moduleId}_${sectionId}_${taskCount}" name="task_answer_${moduleId}_${sectionId}_${taskCount}" required>
                    </div>
                </div>
            `;
            tasksDiv.insertAdjacentHTML('beforeend', newTask);
        }
    </script>
</body>
</html>
