{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>{{ course.name }}</h1>
        <p><strong>Автор:</strong> {{ course.author }}</p>
        <p><strong>Преподаватель:</strong> {{ course.teacher }}</p>
        <p><strong>Язык:</strong> {{ course.language }}</p>
        <p><strong>Количество студентов:</strong> {{ students_count }}</p>

        <a href="{% url 'course_list' %}" class="btn btn-secondary mt-3">Назад к списку</a>
    </div>
</body>
</html>
